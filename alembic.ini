# ==============================================================================
# alembic.ini — Configuração principal do Alembic
# ==============================================================================
# A URL do banco NÃO é definida aqui.
# É lida do .env via python-dotenv no alembic/env.py.
# ==============================================================================

[alembic]
# Localização dos scripts de migration
script_location = alembic

# Formato do nome dos arquivos de migration gerados
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone das datas nos arquivos de migration
timezone = America/Sao_Paulo

# Comprimento máximo do slug no nome do arquivo
truncate_slug_length = 40

# Não truncar a saída do diff de schema
output_encoding = utf-8


# ==============================================================================
# LOGGING
# ==============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
