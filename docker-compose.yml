version: '3.8'
services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    ports:
      - "8081:8080"
    environment:
      - API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_TYPE=api-key
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=psql_bouncer
      - DATABASE_BOUNCER_CONNECTION_URI=${DATABASE_BOUNCER_CONNECTION_URI}
      - DATABASE_CONNECTION_URI=${DATABASE_CONNECTION_URI}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=${REDIS_URL}
      - CACHE_REDIS_PREFIX_KEY=evolution-cache
      - CACHE_REDIS_TTL=604800
    volumes:
      - ./evolution_data:/app/instances
    command: ["node", "./dist/src/main.js"]