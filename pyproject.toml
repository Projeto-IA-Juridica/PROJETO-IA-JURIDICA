[project]
name = "concierge-juridico"
version = "0.1.0"
description = "Concierge Jurídico Digital — IA conversacional para escritórios de advocacia"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    # Database
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    # Cache
    "redis==5.0.1",
    # Security
    "cryptography==42.0.0",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.1.2",
    # HTTP client
    "httpx==0.26.0",
    # Validation
    "pydantic[email]==2.5.0",
    "pydantic-settings==2.1.0",
    # Monitoring
    "prometheus-client==0.19.0",
    "sentry-sdk[fastapi]==1.40.0",
    # Logging
    "structlog==24.1.0",
]

[project.optional-dependencies]
feature1 = [
    # IA & LLM
    "langchain==0.2.16",
    "langchain-text-splitters==0.2.4",
    "langchain-anthropic==0.1.23",
    "langchain-openai==0.1.25",
    "langchain-community==0.2.16",
    "langgraph==0.2.28",
    "anthropic==0.100.0",
    "openai==1.50.2",
    "tiktoken==0.7.0",
    # Async tasks
    "celery==5.3.6",
    "flower==2.0.1",
    "redbeat==2.2.0",
    # HTTP async
    "aiohttp==3.9.3",
    # Resiliência
    "pybreaker==1.2.0",
    # Audio
    "pydub==0.25.1",
]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "httpx==0.26.0",
    "aiosqlite==0.20.0",      # driver SQLite async — obrigatório para sqlite+aiosqlite:///:memory: nos testes
    "ruff==0.2.1",
    "black==24.1.1",
    "mypy==1.8.0",
    "pre-commit==3.6.0",
    "factory-boy==3.3.0",
    "faker==22.6.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "feature_*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "feature_1_ia_personalizada/tests",
    "shared/tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=feature_1_ia_personalizada --cov=shared --cov-report=term-missing --cov-report=html --cov-fail-under=70"

[tool.ruff]
target-version = "py312"
line-length = 100
# Excluir pastas que não são código de produção: scripts utilitários,
# migrations Alembic e experimentos isolados têm padrões próprios (E402, etc.)
exclude = ["scripts", "alembic", "teste_datajud"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments (FastAPI depends on this)
]

[tool.ruff.lint.per-file-ignores]
# conftest e arquivos de teste que carregam env vars antes dos imports de app —
# E402 é intencional nesses arquivos para garantir que os mocks são injetados primeiro
"**/tests/**/conftest.py" = ["E402"]
"**/tests/**/*.py" = ["E402"]
# workers/celery_app.py importa tasks no final do arquivo (padrão Celery)
"**/workers/celery_app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "feature_1_ia_personalizada"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true  # libs externas sem stubs (LangChain, pgvector, etc.)

# Módulos internos: checagem estrita mesmo com ignore_missing_imports global.
# Any implícito proveniente de libs externas não "contamina" o código interno.
[[tool.mypy.overrides]]
module = [
    "feature_1_ia_personalizada.services.*",
    "feature_1_ia_personalizada.workers.*",
    "feature_1_ia_personalizada.api.*",
    "shared.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.mutmut]
paths_to_mutate = "feature_1_ia_personalizada/services/,shared/"
tests_dir = "feature_1_ia_personalizada/tests/,shared/tests/"
# -x para no primeiro teste falho (rápido); --no-cov para não medir cobertura durante mutação
runner = "python -m pytest feature_1_ia_personalizada/tests/ shared/tests/ -x -q --no-header --no-cov"
