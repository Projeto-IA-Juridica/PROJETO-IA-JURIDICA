# =============================================================================
# Concierge Jurídico — Loki Configuration
# =============================================================================
# Servidor Loki local para agregação de logs dos containers Docker.
# Os logs são coletados pelo Promtail e podem ser visualizados no Grafana Cloud
# via datasource Loki apontando para http://localhost:3100
# =============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Rejeita logs com mais de 1h de atraso
  reject_old_samples: true
  reject_old_samples_max_age: 1h
  # Limite de ingestão por tenant
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

ruler:
  alertmanager_url: http://localhost:9093