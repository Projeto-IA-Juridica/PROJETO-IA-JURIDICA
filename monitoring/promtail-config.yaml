# =============================================================================
# Concierge Jurídico — Promtail Configuration (WSL2 / Docker Desktop Windows)
# =============================================================================
# No Windows com Docker Desktop + WSL2, os logs dos containers ficam em:
# /var/lib/docker/containers dentro do WSL2, mas esse path é read-only no host.
# Solução: usar a API do Docker via socket para coletar logs.
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ---------------------------------------------------------------------------
  # Logs via Docker socket (compatível com WSL2 / Docker Desktop Windows)
  # ---------------------------------------------------------------------------
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - concierge-app-f1
              - concierge-celery-worker
              - concierge-celery-beat
              - concierge-flower
              - concierge-postgres
              - concierge-redis

    relabel_configs:
      # Usa o nome do container como label
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container

      # Usa a imagem como label service
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

      # Adiciona label de ambiente
      - target_label: env
        replacement: production

    pipeline_stages:
      # Tenta parsear logs JSON do structlog
      - json:
          expressions:
            level: level
            event: event

      - labels:
          level:

      # Filtra logs vazios
      - drop:
          expression: "^\\s*$"