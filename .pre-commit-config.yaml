repos:
  # Ruff: linting + isort + auto-fix
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Black: formatação de código
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black

  # Mypy: checagem de tipos
  # pass_filenames=false + entry customizado = roda exatamente como no CI
  # (evita o crash "Cannot find module for google" que ocorre ao checar arquivo-a-arquivo)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        pass_filenames: false
        entry: mypy feature_1_ia_personalizada shared
        additional_dependencies:
          - pydantic==2.5.0
          - pydantic-settings==2.1.0
          - sqlalchemy==2.0.25
          - fastapi==0.109.0
          - structlog==24.1.0
          - httpx==0.26.0
          - celery==5.3.6
          - prometheus-client==0.19.0
          - redis==5.0.1

  # Hooks gerais de qualidade
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
