repos:
  # Ruff: linting + isort (substitui flake8 + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        args: [--fix]

  # Black: formatação
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black

  # Mypy: checagem de tipos (apenas módulos internos, espelhando o CI)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [feature_1_ia_personalizada, shared]
        pass_filenames: false
        additional_dependencies:
          - sqlalchemy[mypy]
          - pydantic

  # Checagens built-in: arquivos grandes, conflitos de merge, etc.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]
