<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>amicus — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@400&display=swap" />
  <link rel="stylesheet" href="amicus-design.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Fundo de ondas -->
  <canvas id="wave-canvas"></canvas>

  <!-- Navbar -->
  <nav id="navbar">
    <div id="logo-nav" class="logo-wrap"></div>
    <a href="/ajuda" class="nav-link">
      Precisa de ajuda? <span class="nav-link-bold">Fale conosco →</span>
    </a>
  </nav>

  <!-- Conteúdo central -->
  <main>
    <div class="card-wrap">

      <!-- Logo + títulos -->
      <div class="hero-header">
        <svg class="arch-logo" width="100" height="106" viewBox="0 0 68 72" fill="none">
          <rect x="10" y="0" width="48" height="6" rx="1" fill="#1E3A5F"/>
          <path d="M4 9 L64 9 L60 18 L8 18 Z" fill="#1E3A5F"/>
          <rect x="0" y="21" width="68" height="26" fill="#1E3A5F"/>
          <path d="M24 47 L24 36 Q24 27 34 27 Q44 27 44 36 L44 47 Z" fill="white"/>
          <rect x="7"  y="27" width="12" height="12" fill="white"/>
          <rect x="10" y="30" width="6"  height="6"  fill="#1E3A5F"/>
          <rect x="49" y="27" width="12" height="12" fill="white"/>
          <rect x="52" y="30" width="6"  height="6"  fill="#1E3A5F"/>
          <rect x="0"  y="47" width="24" height="25" fill="#1E3A5F"/>
          <rect x="44" y="47" width="24" height="25" fill="#1E3A5F"/>
        </svg>
        <h1 class="hero-title">Otimizando o tempo do seu escritório.</h1>
        <p class="hero-sub">Em qualquer lugar. A qualquer hora.</p>
      </div>

      <!-- Card branco -->
      <div class="card">

        <!-- E-mail -->
        <div class="field-group">
          <label class="field-label">E-mail profissional</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="#B0C8DC" stroke-width="1.8" stroke-linecap="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input id="email-input" type="email" placeholder="advogado@escritorio.com.br" autocomplete="email" />
          </div>
        </div>

        <!-- Senha -->
        <div class="field-group">
          <div class="field-label-row">
            <label class="field-label">Senha</label>
            <a href="/esqueci-senha" class="forgot-link">Esqueceu?</a>
          </div>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="#B0C8DC" stroke-width="1.8" stroke-linecap="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input id="pass-input" type="password" placeholder="••••••••" autocomplete="current-password" />
            <button id="toggle-pass" class="eye-btn" aria-label="Mostrar senha">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8AAAC0" stroke-width="1.8" stroke-linecap="round" style="display:none">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8AAAC0" stroke-width="1.8" stroke-linecap="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Botões -->
        <button class="btn-primary">Entrar na plataforma</button>
        <button class="btn-secondary">
          Novo escritório? &nbsp;<span class="btn-link">Criar conta gratuita →</span>
        </button>
      </div>

      <!-- Badges -->
      <div class="badges">
        <div class="badge"><span class="dot"></span>OAB 205/2021</div>
        <div class="badge"><span class="dot"></span>LGPD</div>
        <div class="badge"><span class="dot"></span>AES-256</div>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
