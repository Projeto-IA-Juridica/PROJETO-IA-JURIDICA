# ==============================================================================
# CI — Concierge Jurídico Digital
# ==============================================================================
# Pipeline executado em todo PR para main/develop e push em main.
#
# Nota sobre serviços externos:
#   Os testes NÃO precisam de Postgres ou Redis reais.
#   - conftest.py usa sqlite+aiosqlite:///:memory: (SQLite in-memory) como banco
#   - FakeRedis (in-memory) simula o Redis nas fixtures
#   - conftest.py injeta todas as env vars obrigatórias via os.environ.setdefault
#     antes dos imports — nenhum .env ou secret é necessário para rodar pytest
# ==============================================================================

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Lint + Tipos + Testes
  # ----------------------------------------------------------------------------
  test:
    name: Lint, Tipos e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"  # cacheia ~/.cache/pip entre runs para acelerar install

      # Instala deps da aplicação (requirements-f1.txt = base + feature1)
      # depois instala ferramentas de dev declaradas em pyproject.toml [dev]
      # (pytest, ruff, black, mypy, aiosqlite, etc.)
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements-f1.txt
          pip install -e ".[dev]"

      # ruff valida estilo e erros comuns (substitui flake8 + isort)
      - name: Lint — Ruff
        run: ruff check .

      # black --check apenas verifica formatação, não modifica arquivos
      - name: Formatação — Black
        run: black --check .

      # mypy faz análise estática de tipos — BLOQUEANTE: erros de tipo impedem merge
      # ignore_missing_imports = true está em pyproject.toml — não falha por stubs ausentes
      # continue-on-error: false (padrão) garante que o job falha se mypy reportar erros
      - name: Tipos — Mypy
        run: mypy feature_1_ia_personalizada shared
        continue-on-error: false

      # conftest.py (scope=session) já injeta todas as env vars via os.environ.setdefault
      # antes do primeiro import de módulo — nenhuma variável de ambiente extra necessária aqui
      # --cov-fail-under=70 está configurado em pyproject.toml — bloqueia PR se cobertura < 70%
      - name: Testes — Pytest
        run: pytest --tb=short

      # Envia relatório de cobertura para Codecov (opcional — funciona sem o secret configurado)
      # Para ativar: adicionar CODECOV_TOKEN em Settings > Secrets > Actions no GitHub
      - name: Upload de cobertura para Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        # continue-on-error garante que o job não falha se o token não estiver configurado
        continue-on-error: true

  # ----------------------------------------------------------------------------
  # Job 2: Testes de integração com PostgreSQL+pgvector real
  # Roda em paralelo com o job de lint/unit.
  # Detecta bugs que o SQLite in-memory não pega:
  #   - JSONB nativo (constraints, queries específicas)
  #   - pgvector (embeddings, busca por similaridade)
  #   - UNIQUE constraints concorrentes
  #   - SELECT FOR UPDATE (distributed lock em processo_state.py)
  # ----------------------------------------------------------------------------
  integration-postgres:
    name: Integração (PostgreSQL + pgvector)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_concierge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements-f1.txt
          pip install -e ".[dev]"

      - name: Testes de integração com PostgreSQL real
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_concierge
        run: |
          pytest feature_1_ia_personalizada/tests/integration/ shared/tests/ \
            --tb=short -v --no-cov

  # ----------------------------------------------------------------------------
  # Job 3: Build Docker — valida que a imagem compila sem erros
  # Roda em paralelo com o job de testes
  # ----------------------------------------------------------------------------
  docker-build:
    name: Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Valida que o Dockerfile.f1 compila corretamente (multi-stage build)
      # Não faz push — apenas verifica que a imagem é buildável
      - name: Build imagem
        run: |
          docker build \
            -t concierge-f1:ci \
            -f infrastructure/docker/Dockerfile.f1 \
            .
