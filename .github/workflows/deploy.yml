# ==============================================================================
# CD — Concierge Jurídico Digital [PIJ-204]
# ==============================================================================
# Pipeline de deploy contínuo com Railway.
#
# Como funciona:
#   1. git push → main
#   2. CI (ci.yml) roda testes + build Docker (validação)
#   3. Railway detecta o novo commit e faz o deploy automaticamente
#   4. Este workflow aguarda o Railway concluir e executa smoke tests
#
# Pré-requisitos no GitHub (Settings > Secrets > Actions):
#   RAILWAY_APP_URL → URL pública do app no Railway
#                     ex: https://concierge-juridico.railway.app
#
# Nota: Build, push e deploy são feitos PELO RAILWAY automaticamente.
# Não precisamos de SSH, Docker ou servidor próprio.
# ==============================================================================

name: Deploy — Produção

on:
  # Dispara automaticamente quando o CI passa em main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # Disparo manual: útil para verificar saúde após deploy manual no Railway
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Captura baseline de saúde ANTES do novo deploy subir.
  # Falha silenciosa (continue-on-error) — produção pode estar em manutenção.
  # O resultado é exibido no resumo final para comparação pré/pós.
  # ----------------------------------------------------------------------------
  pre-deploy-health:
    name: Health Check Pré-Deploy
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      pre_status: ${{ steps.capture.outputs.status }}

    steps:
      - name: Capturar estado atual de produção
        id: capture
        # continue-on-error: produção pode estar down antes de um deploy de recovery
        continue-on-error: true
        run: |
          RESPONSE=$(curl -sf --max-time 10 \
            "${{ secrets.RAILWAY_APP_URL }}/health/detailed" \
            || echo '{"status":"unreachable"}')

          STATUS=$(echo "$RESPONSE" | jq -r '.status // "unknown"')
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Saude pre-deploy: $STATUS"
          echo "$RESPONSE" | jq -r '
            .checks // {} | to_entries[] |
            "  \(.key): \(.value.status)"
          ' 2>/dev/null || true

  # ----------------------------------------------------------------------------
  # Job 2: Aguardar Railway concluir o deploy e a API responder.
  # Railway detecta o push e faz build + deploy automaticamente.
  # ----------------------------------------------------------------------------
  wait-for-deploy:
    name: Aguardar Deploy (Railway)
    runs-on: ubuntu-latest
    needs: pre-deploy-health

    outputs:
      app_url: ${{ steps.set-url.outputs.url }}

    steps:
      - name: Definir URL do app
        id: set-url
        run: echo "url=${{ secrets.RAILWAY_APP_URL }}" >> $GITHUB_OUTPUT

      - name: Aguardar API responder (polling /health)
        run: |
          echo "Polling /health ate a API responder..."
          MAX_ATTEMPTS=20
          ATTEMPT=0
          until curl -sf "${{ secrets.RAILWAY_APP_URL }}/health" > /dev/null 2>&1; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "API nao respondeu apos $MAX_ATTEMPTS tentativas (${MAX_ATTEMPTS} x 15s = $((MAX_ATTEMPTS * 15))s)"
              exit 1
            fi
            echo "  Tentativa $ATTEMPT/$MAX_ATTEMPTS — aguardando 15s..."
            sleep 15
          done
          echo "API respondendo em ${{ secrets.RAILWAY_APP_URL }}"

  # ----------------------------------------------------------------------------
  # Job 3: Smoke tests — valida endpoints críticos após o deploy
  # ----------------------------------------------------------------------------
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: wait-for-deploy

    steps:
      - name: GET /health → 200
        run: |
          curl -f --retry 3 --retry-delay 5 \
            "${{ secrets.RAILWAY_APP_URL }}/health"

      - name: GET /health/ready → 200 (PostgreSQL + Redis críticos)
        run: |
          curl -f --retry 3 --retry-delay 5 \
            "${{ secrets.RAILWAY_APP_URL }}/health/ready"

      - name: GET /health/detailed → todos os 6 serviços saudáveis
        # Falha se status == "error" (PostgreSQL ou Redis indisponíveis).
        # Status "degraded" (serviços externos) gera aviso mas não bloqueia deploy.
        run: |
          RESPONSE=$(curl -sf --retry 3 --retry-delay 5 \
            "${{ secrets.RAILWAY_APP_URL }}/health/detailed")

          # Exibe status geral e latência
          echo "$RESPONSE" | jq -r '"Status geral: \(.status)  (\(.total_ms)ms)"'

          # Exibe cada serviço com marcador OK / WARN / FAIL
          echo "$RESPONSE" | jq -r '
            .checks | to_entries[] |
            if   .value.status == "ok"       then "  [OK]   \(.key): \(.value.status)"
            elif .value.status == "skipped"  then "  [OK]   \(.key): skipped"
            elif .value.status == "degraded" then "  [WARN] \(.key): \(.value.status)"
            else                                  "  [FAIL] \(.key): \(.value.status)"
            end
          '

          # Extrai status geral para decisão
          STATUS=$(echo "$RESPONSE" | jq -r '.status')

          if [ "$STATUS" = "error" ]; then
            FAILED=$(echo "$RESPONSE" | jq -r '
              [.checks | to_entries[]
               | select(.value.status != "ok" and .value.status != "skipped")
               | .key] | join(", ")
            ')
            echo "FALHA: servicos criticos indisponiveis: $FAILED" >&2
            exit 1
          fi

          if [ "$STATUS" = "degraded" ]; then
            DEGRADED=$(echo "$RESPONSE" | jq -r '
              [.checks | to_entries[]
               | select(.value.status == "degraded")
               | .key] | join(", ")
            ')
            echo "AVISO: servicos externos degradados (nao bloqueia deploy): $DEGRADED"
          else
            echo "Todos os servicos saudaveis."
          fi

      - name: POST /auth/login com credenciais inválidas → 401
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_APP_URL }}/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke-test@nao-existe.com","password":"wrongpassword"}')
          [ "$status" = "401" ] || { echo "Esperado 401, recebeu $status"; exit 1; }

      - name: POST /webhook/whatsapp sem apikey → 401
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_APP_URL }}/webhook/whatsapp" \
            -H "Content-Type: application/json" \
            -d '{}')
          [ "$status" = "401" ] || { echo "Esperado 401, recebeu $status"; exit 1; }

      - name: GET /metrics → 200 (Prometheus)
        run: |
          curl -f --retry 2 \
            "${{ secrets.RAILWAY_APP_URL }}/metrics"

  # ----------------------------------------------------------------------------
  # Job 4: Resumo final — mostra saúde pré e pós-deploy lado a lado
  # ----------------------------------------------------------------------------
  notify:
    name: Resumo do Deploy
    runs-on: ubuntu-latest
    needs: [pre-deploy-health, wait-for-deploy, smoke-test]
    if: always()

    steps:
      - name: Escrever resumo
        run: |
          if [ "${{ needs.smoke-test.result }}" = "success" ]; then
            STATUS="SUCESSO"
          else
            STATUS="FALHA"
          fi

          echo "## $STATUS — Deploy em Produção (Railway)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Health Pré-Deploy | ${{ needs.pre-deploy-health.outputs.pre_status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Aguardar Railway | ${{ needs.wait-for-deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ secrets.RAILWAY_APP_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.event.workflow_run.head_sha || github.sha }}\`" >> $GITHUB_STEP_SUMMARY
